<div class="group-list-page">

  <app-navbar></app-navbar>

  <main class="group-container">

    <div class="page-header">
      <div>
        <h1>Groups</h1>
        <p>Browse groups and access their channels.</p>
      </div>
    </div>

    <div class="groups">

      <div
        class="group-card"
        *ngFor="let group of groups">

        <div class="group-icon">
          {{ group.name.charAt(0) }}
        </div>

        <div class="group-content">

          <h2>{{ group.name }}</h2>

          <p>
            {{ group.description }}
          </p>

          <div class="group-stats">
            <span>{{ group.members }} members</span>
            <span>{{ group.channels }} channels</span>
          </div>

          <div class="group-actions">

            <a
              [routerLink]="['/channels', group.id]"
              class="primary-button">
              View Channels
            </a>

            <button
              type="button"
              class="secondary-button">
              Request to Join
            </button>

          </div>

        </div>

      </div>

    </div>

  </main>

</div>
