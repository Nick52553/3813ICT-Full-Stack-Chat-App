<app-navbar></app-navbar>

<main class="management-container">

  <h1>Group Management</h1>

  <section class="management-card">

    <h2>Create Group</h2>

    <form (ngSubmit)="createGroup()">

      <input
        type="text"
        name="groupName"
        [(ngModel)]="groupName"
        placeholder="Group name"
        required>

      <textarea
        name="description"
        [(ngModel)]="description"
        placeholder="Group description">
      </textarea>

      <input
        type="number"
        name="ageLimit"
        [(ngModel)]="ageLimit"
        min="0"
        placeholder="Age limit">

      <button type="submit">
        Create Group
      </button>

    </form>

  </section>

  <section class="management-card">

    <h2>Assign User to Group</h2>

    <select
      name="selectedGroupId"
      [(ngModel)]="selectedGroupId">

      <option [ngValue]="null">
        Select Group
      </option>

      <option
        *ngFor="let group of groups"
        [ngValue]="group.id">

        {{ group.name }}

      </option>

    </select>

    <select
      name="selectedUserId"
      [(ngModel)]="selectedUserId">

      <option [ngValue]="null">
        Select User
      </option>

      <option
        *ngFor="let user of users"
        [ngValue]="user.id">

        {{ user.username }}

      </option>

    </select>

    <button
      type="button"
      (click)="addMember()">

      Add Member

    </button>

  </section>

  <section class="management-card">

    <h2>Assign Group Admin</h2>

    <select
      name="selectedAdminId"
      [(ngModel)]="selectedAdminId">

      <option [ngValue]="null">
        Select User
      </option>

      <option
        *ngFor="let user of users"
        [ngValue]="user.id">

        {{ user.username }}

      </option>

    </select>

    <button
      type="button"
      (click)="assignAdmin()">

      Assign Admin

    </button>

  </section>

  <p *ngIf="message">
    {{ message }}
  </p>

  <p *ngIf="error">
    {{ error }}
  </p>

</main>
