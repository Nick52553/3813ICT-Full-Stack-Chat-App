<div class="dashboard-page">

  <app-navbar></app-navbar>

  <main class="dashboard-container">

    <section class="welcome-section">
      <h1>Dashboard</h1>
      <p>Welcome to your chat application.</p>
    </section>

    <section class="dashboard-grid">

      <div class="dashboard-card">
        <h2>Groups</h2>
        <p>Browse groups you can join and access their channels.</p>

        <a
          routerLink="/groups"
          class="dashboard-button">
          View Groups
        </a>
      </div>

      <div class="dashboard-card">
        <h2>My Channels</h2>
        <p>Access the channels available to you.</p>

        <a
          routerLink="/groups"
          class="dashboard-button">
          View Channels
        </a>
      </div>

      <div class="dashboard-card">
        <h2>Profile</h2>
        <p>View your account information and role.</p>

        <a
          routerLink="/profile"
          class="dashboard-button">
          View Profile
        </a>
      </div>

    </section>

  </main>

</div>
