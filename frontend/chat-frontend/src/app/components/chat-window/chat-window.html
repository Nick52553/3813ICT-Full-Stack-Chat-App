<div class="chat-page">

  <app-navbar></app-navbar>

  <div class="chat-layout">

    <main class="chat-main">

      <!-- Chat Header -->
      <header class="chat-header">

        <div>
          <h1># {{ channelName }}</h1>
          <p>{{ groupName }}</p>
        </div>

        <a
          [routerLink]="['/channels', groupId]"
          class="back-button">
          Back to Channels
        </a>

      </header>

      <!-- Phase 1 Notice -->
      <div class="phase-label">
        PHASE 1 PROTOTYPE
      </div>

      <!-- Messages -->
      <section class="messages">

        <div class="system-message">
          You joined the room.
        </div>

        <div
          class="message"
          *ngFor="let message of messages">

          <div class="message-avatar">
            {{ message.username.charAt(0).toUpperCase() }}
          </div>

          <div class="message-content">

            <div class="message-info">

              <strong>
                {{ message.username }}
              </strong>

              <span>
                {{ message.time }}
              </span>

            </div>

            <p>
              {{ message.text }}
            </p>

            <!-- Only show delete for your own messages -->
            <button
              *ngIf="message.username === currentUser.username"
              type="button"
              class="delete-message-button"
              (click)="deleteMessage(message.id)">

              Delete

            </button>

          </div>

        </div>

      </section>

      <!-- Message Composer -->
      <footer class="message-composer">

        <button
          type="button"
          class="attachment-button"
          title="Attach image">
          📎
        </button>

        <input
          type="text"
          name="message"
          [(ngModel)]="messageText"
          (keyup.enter)="sendMessage()"
          placeholder="Type a message..."
        />

        <button
          type="button"
          class="send-button"
          (click)="sendMessage()">

          Send

        </button>

      </footer>

      <div class="chat-note">
        PNG, JPG and GIF images under 2MB are supported.
      </div>

    </main>

  </div>

</div>
