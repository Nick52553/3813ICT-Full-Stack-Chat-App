<div class="channel-list-page">

  <app-navbar></app-navbar>

  <main class="channel-container">

    <div class="page-header">

      <div>
        <h1>{{ groupName }}</h1>
        <p>Select a channel to start chatting.</p>
      </div>

      <a
        routerLink="/groups"
        class="back-button">
        Back to Groups
      </a>

    </div>

    <div class="channels">

      <div
        class="channel-card"
        *ngFor="let channel of channels">

        <div class="channel-icon">
          #
        </div>

        <div class="channel-content">

          <h2>{{ channel.name }}</h2>

          <p>
            {{ channel.description }}
          </p>

          <span>
            {{ channel.members }} members
          </span>

        </div>

        <a
          [routerLink]="[
            '/chat',
            groupId,
            channel.id
          ]"
          class="open-button">
          Open Chat
        </a>

      </div>

    </div>

  </main>

</div>
