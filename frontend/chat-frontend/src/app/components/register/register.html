<div class="login-container">

  <div class="login-card">

    <h1>Chat Application</h1>
    <h2>Bootstrap Super Admin</h2>
    <p>No users exist yet. Register the first account to become the Super Admin.</p>

    <form (ngSubmit)="register()">

      <div class="form-group">
        <label for="username">Username</label>

        <input
          id="username"
          type="text"
          name="username"
          [(ngModel)]="username"
          required
          placeholder="Enter username"
        />
      </div>

      <div class="form-group">
        <label for="password">Password</label>

        <input
          id="password"
          type="password"
          name="password"
          [(ngModel)]="password"
          required
          placeholder="Enter password"
        />
      </div>

      <div class="form-group">
        <label for="age">Age</label>

        <input
          id="age"
          type="number"
          name="age"
          [(ngModel)]="age"
          placeholder="Enter age"
        />
      </div>

      <button type="submit">
        Register Super Admin
      </button>

      <p *ngIf="registerFailed" class="error">
        {{ registerMessage }}
      </p>

    </form>

  </div>

</div>
