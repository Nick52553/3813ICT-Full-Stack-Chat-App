<div class="login-container">

  <div class="login-card">

    <h1>Chat Application</h1>
    <h2>Create Account</h2>

    <form (ngSubmit)="signup()">

      <div class="form-group">
        <label for="username">Username</label>

        <input
          id="username"
          type="text"
          name="username"
          [(ngModel)]="username"
          required
          placeholder="e.g. user1@com.au"
        />
      </div>

      <div class="form-group">
        <label for="password">Password</label>

        <input
          id="password"
          type="password"
          name="password"
          [(ngModel)]="password"
          required
          placeholder="Enter password"
        />
      </div>

      <div class="form-group">
        <label for="dob">Date of Birth</label>

        <input
          id="dob"
          type="date"
          name="dob"
          [(ngModel)]="dob"
          required
        />
      </div>

      <button type="submit">
        Create Account
      </button>

      <p *ngIf="signupFailed" class="error">
        {{ signupMessage }}
      </p>

    </form>

  </div>

</div>
