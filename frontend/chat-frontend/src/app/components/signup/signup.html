<div class="login-container">

  <div class="login-card">

    <h1>Chat Application</h1>
    <h2>Create Account</h2>

    <form (ngSubmit)="signup()" novalidate>

      <div class="form-group">
        <label for="username">Username</label>

        <input
          id="username"
          type="text"
          name="username"
          [(ngModel)]="username"
          required
          [attr.maxlength]="limits.USERNAME_MAX"
          autocomplete="username"
          aria-describedby="username-error"
          [attr.aria-invalid]="submitted && !!errors.username"
          placeholder="e.g. user1@com.au"
        />

        <small id="username-error" class="field-error" *ngIf="submitted && errors.username">
          {{ errors.username }}
        </small>
      </div>

      <div class="form-group">
        <label for="password">Password</label>

        <input
          id="password"
          type="password"
          name="password"
          [(ngModel)]="password"
          required
          autocomplete="new-password"
          aria-describedby="password-hint password-error"
          [attr.aria-invalid]="submitted && !!errors.password"
          placeholder="Enter password"
        />

        <small id="password-hint">
          At least {{ limits.PASSWORD_MIN }} characters, including an uppercase letter.
        </small>

        <small id="password-error" class="field-error" *ngIf="submitted && errors.password">
          {{ errors.password }}
        </small>
      </div>

      <div class="form-group">
        <label for="confirmPassword">Confirm Password</label>

        <input
          id="confirmPassword"
          type="password"
          name="confirmPassword"
          [(ngModel)]="confirmPassword"
          required
          autocomplete="new-password"
          aria-describedby="confirm-error"
          [attr.aria-invalid]="submitted && !!errors.confirmPassword"
          placeholder="Re-enter password"
        />

        <small id="confirm-error" class="field-error" *ngIf="submitted && errors.confirmPassword">
          {{ errors.confirmPassword }}
        </small>
      </div>

      <div class="form-group">
        <label for="dob">Date of Birth</label>

        <input
          id="dob"
          type="date"
          name="dob"
          [(ngModel)]="dob"
          required
          [max]="today"
          aria-describedby="dob-error"
          [attr.aria-invalid]="submitted && !!errors.dob"
        />

        <small id="dob-error" class="field-error" *ngIf="submitted && errors.dob">
          {{ errors.dob }}
        </small>
      </div>

      <button type="submit" [disabled]="submitting">
        {{ submitting ? 'Creating account…' : 'Create Account' }}
      </button>

      <p *ngIf="signupMessage" class="error" role="alert">
        {{ signupMessage }}
      </p>

    </form>

  </div>

</div>
