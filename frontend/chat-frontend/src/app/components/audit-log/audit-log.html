<div class="audit-page">

  <app-navbar></app-navbar>

  <main class="audit-container">

    <div class="page-header">
      <div>
        <h1>Audit Log</h1>
        <p>
          A record of every significant action taken across the system.
        </p>
      </div>
    </div>

    <p
      *ngIf="error"
      class="error-message">
      {{ error }}
    </p>

    <p
      *ngIf="!error && entries.length === 0"
      class="empty-message">
      No audit entries recorded yet.
    </p>

    <!-- Scrolls sideways on narrow screens instead of cutting
         columns off; focusable so keyboard users can scroll it. -->
    <div
      class="table-scroll"
      *ngIf="entries.length > 0"
      tabindex="0"
      role="region"
      aria-label="Audit log entries">

    <table class="audit-table">

      <thead>
        <tr>
          <th>Timestamp</th>
          <th>Action</th>
          <th>Actor ID</th>
          <th>Details</th>
        </tr>
      </thead>

      <tbody>
        <tr *ngFor="let entry of entries">
          <td>{{ entry.timestamp | date:'d MMM y, h:mm:ss a' }}</td>
          <td>{{ entry.action }}</td>
          <td>{{ entry.actorId }}</td>
          <td>{{ entry.details | json }}</td>
        </tr>
      </tbody>

    </table>

    </div>

  </main>

</div>
