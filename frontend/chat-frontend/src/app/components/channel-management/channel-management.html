<app-navbar></app-navbar>

<main class="management-container">

  <h1>Channel Management</h1>

  <section class="management-card">

    <h2>Create Channel</h2>

    <form (ngSubmit)="createChannel()" novalidate>

      <select
        name="groupId"
        [(ngModel)]="groupId"
        aria-label="Group"
        aria-describedby="channel-group-error"
        [attr.aria-invalid]="submitted && !!errors.groupId"
        required>

        <option [ngValue]="null">
          Select Group
        </option>

        <option
          *ngFor="let group of groups"
          [ngValue]="group.id">

          {{ group.name }}

        </option>

      </select>

      <small id="channel-group-error" class="field-error" *ngIf="submitted && errors.groupId">
        {{ errors.groupId }}
      </small>

      <input
        type="text"
        name="channelName"
        [(ngModel)]="channelName"
        placeholder="Channel name"
        aria-label="Channel name"
        [attr.maxlength]="limits.NAME_MAX"
        aria-describedby="channel-name-error"
        [attr.aria-invalid]="submitted && !!errors.channelName"
        required>

      <small id="channel-name-error" class="field-error" *ngIf="submitted && errors.channelName">
        {{ errors.channelName }}
      </small>

      <textarea
        name="description"
        [(ngModel)]="description"
        placeholder="Channel description"
        aria-label="Channel description"
        [attr.maxlength]="limits.DESCRIPTION_MAX"
        aria-describedby="channel-description-error"
        [attr.aria-invalid]="submitted && !!errors.description">
      </textarea>

      <small id="channel-description-error" class="field-error" *ngIf="submitted && errors.description">
        {{ errors.description }}
      </small>

      <button type="submit">
        Create Channel
      </button>

    </form>

  </section>

  <section class="management-card">

    <h2>Assign User to Channel</h2>

    <select
      name="channelId"
      aria-label="Channel"
      [(ngModel)]="channelId">

      <option [ngValue]="null">
        Select Channel
      </option>

      <option
        *ngFor="let channel of channels"
        [ngValue]="channel.id">

        {{ channel.name }}

      </option>

    </select>

    <select
      name="userId"
      aria-label="User"
      [(ngModel)]="userId">

      <option [ngValue]="null">
        Select User
      </option>

      <option
        *ngFor="let user of users"
        [ngValue]="user.id">

        {{ user.username }}

      </option>

    </select>

    <button
      type="button"
      (click)="assignUser()">

      Assign User

    </button>

  </section>

  <p *ngIf="message" class="success-message" role="status">
    {{ message }}
  </p>

  <p *ngIf="error" class="error-message" role="alert">
    {{ error }}
  </p>

</main>
