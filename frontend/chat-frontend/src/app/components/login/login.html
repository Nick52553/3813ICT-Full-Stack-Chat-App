<div class="login-container">

  <div class="login-card">

    <h1>Chat Application</h1>
    <h2>Login</h2>

    <form (ngSubmit)="login()" novalidate>

      <div class="form-group">
        <label for="username">Username</label>

        <input
          id="username"
          type="text"
          name="username"
          [(ngModel)]="username"
          required
          autocomplete="username"
          aria-describedby="username-error"
          [attr.aria-invalid]="submitted && !!errors.username"
          placeholder="Enter username"
        />

        <small id="username-error" class="field-error" *ngIf="submitted && errors.username">
          {{ errors.username }}
        </small>
      </div>

      <div class="form-group">
        <label for="password">Password</label>

        <input
          id="password"
          type="password"
          name="password"
          [(ngModel)]="password"
          required
          autocomplete="current-password"
          aria-describedby="password-error"
          [attr.aria-invalid]="submitted && !!errors.password"
          placeholder="Enter password"
        />

        <small id="password-error" class="field-error" *ngIf="submitted && errors.password">
          {{ errors.password }}
        </small>
      </div>

      <button type="submit" [disabled]="submitting">
        {{ submitting ? 'Logging in…' : 'Login' }}
      </button>

      <p *ngIf="loginError" class="error" role="alert">
        {{ loginError }}
      </p>

    </form>

    <p class="signup-link">
      Don't have an account?
      <a routerLink="/signup">Sign up</a>
    </p>

  </div>

</div>
