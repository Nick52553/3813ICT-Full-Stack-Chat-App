<div class="profile-page">

  <app-navbar></app-navbar>

  <main class="profile-container">

    <h1>My Profile</h1>

    <div class="profile-card">

      <div class="avatar-column">

        <img
          *ngIf="avatarSrc; else initialsAvatar"
          class="profile-avatar profile-avatar-image"
          [src]="avatarSrc"
          [alt]="currentUser.username + ' profile picture'" />

        <ng-template #initialsAvatar>
          <div class="profile-avatar" aria-hidden="true">
            {{ initials }}
          </div>
        </ng-template>

        <!-- Hidden file picker, opened by the button below -->
        <input
          #avatarInput
          type="file"
          class="visually-hidden"
          [accept]="imageAccept"
          (change)="onAvatarSelected($event)" />

        <button
          type="button"
          class="avatar-button"
          [disabled]="uploading"
          (click)="avatarInput.click()">
          {{ uploading ? 'Uploading…' : (avatarSrc ? 'Change picture' : 'Add picture') }}
        </button>

        <button
          *ngIf="avatarSrc"
          type="button"
          class="avatar-button avatar-remove"
          [disabled]="uploading"
          (click)="removeAvatar()">
          Remove
        </button>

      </div>

      <div class="profile-details">

        <div class="detail">
          <span>Username</span>
          <strong>{{ currentUser.username }}</strong>
        </div>

        <div class="detail">
          <span>Age</span>
          <strong>{{ currentUser.age }}</strong>
        </div>

        <div class="detail">
          <span>Account Role</span>
          <strong>{{ roleName }}</strong>
        </div>

      </div>

    </div>

    <p class="avatar-hint">
      PNG, JPG or GIF, up to 2MB.
    </p>

    <p class="error" role="alert" *ngIf="errorMessage">
      {{ errorMessage }}
    </p>

    <p class="avatar-success" role="status" *ngIf="successMessage">
      {{ successMessage }}
    </p>

  </main>

</div>
